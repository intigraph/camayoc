name: Camayoc merge or publication event
description: Normalize a forge Actions delivery into CDEvents and use governed Camayoc ingress.
inputs:
  quipu-url:
    description: Quipu server with the reviewed delivery shapes admitted.
    required: true
  quipu-token:
    description: Scoped write credential from a workflow secret.
    required: true
runs:
  using: composite
  steps:
    - name: Record merge or publication
      shell: bash
      env:
        QUIPU_SERVER: ${{ inputs.quipu-url }}
        QUIPU_AUTH_TOKEN: ${{ inputs.quipu-token }}
        FORGE_SERVER_URL: ${{ github.server_url }}
        CAMAYOC_ROOT: ${{ github.action_path }}/../..
      run: |
        set -euo pipefail
        event=$(python3 "$CAMAYOC_ROOT/emitters/github/delivery.py" "$GITHUB_EVENT_NAME" \
          "$GITHUB_EVENT_PATH" --release-commit "$GITHUB_SHA" --forge "$FORGE_SERVER_URL")
        if [ -n "$event" ]; then
          printf '%s' "$event" | python3 "$CAMAYOC_ROOT/scripts/ingest_cdevents.py" --actor forge-actions --post
        fi
