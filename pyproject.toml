# The `camayoc` CLI (alias `cy`): purpose-built agent-memory tools over Quipu.
# Install: uv tool install https://github.com/intigraph/camayoc/releases/download/v0.1.12/camayoc-0.1.12-py3-none-any.whl
# Standard library only at runtime; the generator (scripts/memory_tools.py)
# needs rdflib, the CLI does not.
[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "camayoc"
version = "0.1.12"
description = "Camayoc agent-memory CLI: record and recall typed entities in a Quipu store"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.scripts]
camayoc = "camayoc_cli.cli:main"
cy = "camayoc_cli.cli:main"

[tool.setuptools]
packages = ["camayoc_cli"]

[tool.setuptools.package-data]
camayoc_cli = ["data/*.json", "primer.md"]

[dependency-groups]
review = [
    "boto3>=1.43.111",
    "cryptography>=50.0.2",
    "pyshacl>=0.40.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "rdflib>=7.6.0",
]

[tool.uv.dependency-groups]
review = {requires-python = ">=3.11"}
