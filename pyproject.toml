# The `camayoc` CLI (alias `cy`): purpose-built agent-memory tools over Quipu.
# Install: uv tool install git+https://github.com/intigraph/camayoc
# Standard library only at runtime; the generator (scripts/memory_tools.py)
# needs rdflib, the CLI does not.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camayoc"
version = "0.1.4"
description = "Camayoc agent-memory CLI: record and recall typed entities in a Quipu store"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.scripts]
camayoc = "camayoc_cli.cli:main"
cy = "camayoc_cli.cli:main"

[tool.setuptools]
packages = ["camayoc_cli"]

[tool.setuptools.package-data]
camayoc_cli = ["data/*.json", "primer.md"]
