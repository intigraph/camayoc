name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        uses: ./.github/actions/install-just
      - run: just check

  # camayoc-045: the gate proofs used to run only inside the installer, on a
  # machine that already had a quipu, which meant nobody ran them. The probe
  # tests need no store — they drive gate_probe.sh against stub servers that
  # refuse, accept, echo, fault and vanish — so there is no reason for them not
  # to run on every push.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The stored-query suites execute against rdflib rather than a live
      # quipu, and `@requires_rdflib` skips them when it is absent. Without
      # this line CI skipped all three files — the competency questions are
      # this repo's test suite, so that was a green check over an unrun suite,
      # the same defect as camayoc-045 above. `tests/rdflib_guard.py` now
      # turns that skip into a failure whenever CI is set, so this cannot
      # regress silently; installing it here is what keeps the arm green.
      - run: pip install boto3 cryptography rdflib pyyaml
      - name: Prove private-key refusal boundaries
        run: python3 -m unittest discover -s tests -p test_private_keys.py -v
      - name: Reject tracked private signing material
        run: python3 scripts/check_private_keys.py
      - name: Install just
        uses: ./.github/actions/install-just
      - run: just test

  # aegis-qx96wr: the chaski verdict adapters run on the automation host's
  # Python 3.10, and 3.11+ hides 3.10-only failures. Measured: tracker
  # observedAt carries nanoseconds, which 3.10's fromisoformat rejects, so every
  # idleLimit lapse read UNKNOWN in production while CI (3.11) passed. These
  # are the files chaski executes; run them on the production interpreter.
  adapters-production-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install rdflib
      - name: Chaski adapter tests on Python 3.10
        run: |
          for t in test_instant_parsing test_review_due test_change_adapter test_directive_edges test_blocked_by test_seed_work_items test_seed_change_custody test_seed_metadata_projection test_seed_work_item_sync test_seed_work_item_backfill test_native_review_due test_native_review_changes; do
            python3 -m unittest discover -s tests -p "$t.py" || exit 1
          done

  # The gate proofs are only as good as the shapes they probe, and the stub
  # store cannot check those. This arm builds a real quipu and lets the
  # integration tests in test_metrics_slice.py — which skip themselves without a
  # binary — actually run. Allowed to fail: quipu is a sibling repo on its own
  # release cadence, and a red X here must mean "camayoc broke", not "the
  # neighbours shipped".
  integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install boto3 cryptography rdflib pyyaml
      # PINNED, not releases/latest. The tag used to be resolved at run time, so
      # the binary this job executed was whatever was published last, unreviewed
      # here. It is now a named release checked against a pinned sha256 (equal to
      # the digest GitHub records for the asset) before anything is extracted.
      # To test against a newer quipu, bump QUIPU_TAG and QUIPU_SHA256 together.
      # Exact supersession requires the reported /update commit contract.
      # This released artifact is checksum-verified and exercised by the suite.
      - name: Fetch quipu-server
        id: fetch
        env:
          QUIPU_TAG: quipu-ai-v0.14.1
          QUIPU_SHA256: 2796536df83381e6f17aa96446c750460002155ab6213e3e97360b1f893ff4b6
        run: |
          set -euo pipefail
          tag="$QUIPU_TAG"
          asset="quipu-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$asset" \
            "https://github.com/scbrown/quipu/releases/download/${tag}/${asset}"
          echo "${QUIPU_SHA256}  $asset" | sha256sum -c -
          tar -xzf "$asset"
          echo "QUIPU_SERVER_BIN=$PWD/quipu-${tag}-x86_64-unknown-linux-gnu/quipu-server" >> "$GITHUB_ENV"
          # The tarball ships the CLI next to the server. Exporting it is what
          # makes tests/test_rml_shapes.py actually EXECUTE — before this line the
          # RML shape gate had never run on any machine: it demanded a `quipu` on
          # PATH whenever CI was set, and no job had ever put one there, so it
          # raised on every run of every job instead of validating anything.
          echo "QUIPU_BIN=$PWD/quipu-${tag}-x86_64-unknown-linux-gnu/quipu" >> "$GITHUB_ENV"
      - name: Install just
        uses: ./.github/actions/install-just
      # Captured rather than merely printed. `unittest` exits 0 when every test
      # skips, so this job's own output was the only thing that could tell
      # ran-and-passed from skipped-everything, and nothing read it.
      - name: Run the suite
        run: just test 2>&1 | tee integration-suite.log; exit "${PIPESTATUS[0]}"

      # `if: always()` is load-bearing. The failure this guards against starts
      # at the fetch step — a quipu release with a missing binary asset, which
      # has already shipped once (v0.3.32 had no wasm asset) — and a failed step
      # SKIPS every later step, so the suite never runs at all. Without
      # always(), the verdict would be skipped by exactly the event it exists to
      # report. It writes a GitHub annotation, which surfaces on the run page
      # even though this job is continue-on-error and therefore green.
      - name: Say whether integration actually ran
        if: always()
        run: python3 scripts/integration_verdict.py integration-suite.log

  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install boto3 cryptography rdflib pyyaml
      # PINNED, not releases/latest. The tag used to be resolved at run time, so
      # the binary this job executed was whatever was published last, unreviewed
      # here. It is now a named release checked against a pinned sha256 (equal to
      # the digest GitHub records for the asset) before anything is extracted.
      # To test against a newer quipu, bump QUIPU_TAG and QUIPU_SHA256 together.
      - name: Fetch quipu-server
        id: fetch
        env:
          QUIPU_TAG: quipu-ai-v0.12.1
          QUIPU_SHA256: db82c6beaf43526c713f1679934d6968a5576c46a4a8c4b09114273abe7c3ec2
        run: |
          set -euo pipefail
          tag="$QUIPU_TAG"
          asset="quipu-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$asset" \
            "https://github.com/scbrown/quipu/releases/download/${tag}/${asset}"
          echo "${QUIPU_SHA256}  $asset" | sha256sum -c -
          tar -xzf "$asset"
          echo "QUIPU_SERVER_BIN=$PWD/quipu-${tag}-x86_64-unknown-linux-gnu/quipu-server" >> "$GITHUB_ENV"
          # The tarball ships the CLI next to the server. Exporting it is what
          # makes tests/test_rml_shapes.py actually EXECUTE — before this line the
          # RML shape gate had never run on any machine: it demanded a `quipu` on
          # PATH whenever CI was set, and no job had ever put one there, so it
          # raised on every run of every job instead of validating anything.
          echo "QUIPU_BIN=$PWD/quipu-${tag}-x86_64-unknown-linux-gnu/quipu" >> "$GITHUB_ENV"
      - name: Prove offline governance stage and atomic server refusal
        run: python3 -m unittest discover -s tests -p integration_governance_loader.py -v

  repository-pendant-source:
    name: Repository pendant source controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install query control dependency
        run: pip install rdflib==7.6.0
      - name: Prove pointer scope and publication refusals
        run: |
          python3 scripts/test-repository-knowledge.py
          python3 scripts/test-repository-share-query.py
          python3 scripts/test-repository-share-publication.py
