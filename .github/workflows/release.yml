name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: camayoc-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/release-proof.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-release
          path: release
      - name: Publish existing source format
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
          current_revision=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          expected_revision=$(python3 -c 'import json; print(json.load(open("source.json"))["source_revision"])')
          test "$current_revision" = "$expected_revision"
          python3 -c 'import hashlib,json,sys; p=json.load(open("source.json")); assert p["tag"] == sys.argv[1]; assert p["artifact"] == "camayoc-" + sys.argv[1] + ".tar.gz"; assert hashlib.sha256(open(p["artifact"],"rb").read()).hexdigest() == p["sha256"]' "$RELEASE_TAG"
          python3 -c 'import json; p=json.load(open("source.json")); print("Source bundle from revision " + p["source_revision"] + ". No native executable is included.")' > notes.txt
          gh release create "$RELEASE_TAG" "camayoc-${RELEASE_TAG}.tar.gz" SHA256SUMS source.json --verify-tag --title "Camayoc $RELEASE_TAG" --notes-file notes.txt

  repository-pendant:
    name: Verify repository pendant assets
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Verify trusted producer readback
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python3 scripts/verify-repository-share.py "$RELEASE_TAG" "$(git rev-parse HEAD)"
