name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Publishes the mdBook to the `gh-pages` branch (contents:write), which GitHub
# Pages then serves, the same path yupana uses. One-time setup:
# Settings -> Pages -> "Deploy from a branch" -> gh-pages / (root).
permissions:
  contents: read

concurrency:
  # Isolate PR builds; all publishing events still share the Pages lock.
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Build docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # An exact version, not a range: "^0.4" re-resolved at every run, so the
      # binary that ran with this job's write token could change without a
      # commit here. --locked builds from mdbook's published Cargo.lock, and
      # cargo checks every crate against the registry index checksum. Bump the
      # version in a reviewed change.
      - name: Install mdbook
        run: cargo install mdbook --version "=0.4.52" --locked
      - name: Build book
        run: mdbook build docs
      - name: Deploy to gh-pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book-out
          publish_branch: gh-pages
